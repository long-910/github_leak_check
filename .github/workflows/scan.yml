name: Email Leak Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      full-scan:
        description: 'Scan all commits (ignore previous timestamp, reset accumulated fingerprints)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      reset-commits:
        description: 'Clear accumulated commit leak fingerprints (use after git filter-repo)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write           # needed to push summary.json + card.svg back
  actions: write            # needed to cancel the run when rate limited

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Run the action (self-hosted) ──────────────────────────────────────
      # This repo IS the action, so we reference it directly with ".".
      # Other users would write: uses: long-910/github_leak_check@v1
      - name: Run email leak scan
        id: scan
        uses: ./
        with:
          github-token:   ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          target-emails:  ${{ secrets.TARGET_EMAILS }}
          max-rate-wait:  '60'
          full-scan:      ${{ inputs.full-scan || 'false' }}
          reset-commits:  ${{ inputs.reset-commits || 'false' }}

      # ── Cancel if rate limited ─────────────────────────────────────────────
      - name: Cancel run if rate limited
        if: steps.scan.outputs.exit-code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Rate limited — cancelling run ${{ github.run_id }} to save CI minutes."
          gh run cancel "${{ github.run_id }}"

      # ── Commit results ─────────────────────────────────────────────────────
      # IMPORTANT: Uses noreply bot email so this commit itself is clean.
      # [skip ci] prevents an infinite push → trigger → push loop.
      # leaks.json is gitignored and will never be staged here.
      - name: Commit results
        if: steps.scan.outputs.exit-code != '2'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add results/summary.json results/card.svg
          git diff --staged --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: update scan results [skip ci]" \
            && git push
